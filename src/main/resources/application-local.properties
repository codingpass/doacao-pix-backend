# ---------------------------------------------------------------
# Perfil LOCAL - H2 em memoria, sem necessidade de PostgreSQL
# Rode com: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:pixdonation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chave fake para rodar sem env var real
onipay.api-key=local-dev-fake-key